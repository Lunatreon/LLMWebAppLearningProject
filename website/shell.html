<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#100f13" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <!-- Local previews automatically use port 8000; public pages use this API. -->
    <meta name="feely-api-base" content="https://api.feel-y.com/api/v1" />
    <meta
      name="description"
      content="A private FeelY space for thoughtful conversations and personal reflection."
    />
    <link rel="icon" type="image/png" sizes="1254x1254" href="assets/feely-favicon.png?v=20260928-transparent-1" />
    <title>FeelY Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260918-reliable-1" />
  </head>
  <body>
    <!-- Edit each view in website/views/; this file only defines the shared shell. -->
    <main class="shell" data-app-shell>
      <template data-view="views/auth.html"></template>

      <section id="chat-view" class="chat-view hidden">
        <div
          id="billing-result-banner"
          class="billing-result-banner hidden"
          role="status"
          aria-live="polite"
        >
          <p id="billing-result-text"></p>
          <button id="billing-result-dismiss" type="button" aria-label="Dismiss notification">
            &times;
          </button>
        </div>
        <button
          id="sidebar-backdrop"
          class="sidebar-backdrop hidden"
          type="button"
          aria-label="Close chat navigation"
        ></button>

        <template data-view="views/sidebar.html"></template>

        <template data-view="views/chat.html"></template>

        <template data-view="views/map.html"></template>

        <template data-view="views/journal.html"></template>
      </section>
    </main>

    <template data-view="views/password-reset.html"></template>
    <template data-view="views/email-verification.html"></template>
    <template data-view="views/feedback.html"></template>


    <template data-view="views/reflection.html"></template>

    <template data-view="views/account.html"></template>

    <template data-view="views/delete-account.html"></template>

    <template data-view="views/subscription-cancel.html"></template>

    <script src="app.js?v=20260918-reliable-1" type="text/plain" data-app-script></script>
    <script src="js/account.js?v=20260918-reliable-1" type="text/plain" data-app-script></script>
    <script src="js/dialogs.js" type="text/plain" data-app-script></script>
    <script src="js/auth.js?v=20260918-reliable-1" type="text/plain" data-app-script></script>
    <script src="js/terms.js" type="text/plain" data-app-script></script>
    <script src="js/chat.js?v=20260918-reliable-1" type="text/plain" data-app-script></script>
    <script src="js/journal.js?v=20260918-reliable-1" type="text/plain" data-app-script></script>
    <script src="js/map.js?v=20260918-reliable-1" type="text/plain" data-app-script></script>
    <script src="js/navigation.js?v=20260918-reliable-1" type="text/plain" data-app-script></script>
    <script src="js/feedback.js" type="text/plain" data-app-script></script>
    <script src="js/start.js?v=20260918-reliable-1" type="text/plain" data-app-script></script>
  </body>
</html>
