<dialog id="stripe-cancel-dialog" class="app-dialog confirm-dialog">
  <form id="stripe-cancel-form" method="dialog">
    <button
      class="dialog-close"
      type="button"
      data-close-dialog="stripe-cancel-dialog"
      aria-label="Close"
    >
      &times;
    </button>
    <p class="eyebrow">Cancel subscription</p>
    <h2>Continue to Stripe?</h2>
    <p id="stripe-cancel-copy">
      Nothing changes yet. You will review and confirm the cancellation securely in Stripe.
    </p>
    <p id="stripe-cancel-status" class="form-error" role="status"></p>
    <div class="confirm-dialog-actions">
      <button class="secondary-button" type="button" data-close-dialog="stripe-cancel-dialog">
        Keep subscription
      </button>
      <button id="confirm-stripe-cancel" class="primary-button danger-button" type="submit">
        Continue to Stripe
      </button>
    </div>
  </form>
</dialog>
