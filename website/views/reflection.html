<dialog id="reflection-dialog" class="app-dialog">
  <form id="reflection-form" method="dialog">
    <button class="dialog-close" type="button" data-close-dialog="reflection-dialog" aria-label="Close">&times;</button>
    <p class="eyebrow">Review without shame</p>
    <h2>What happened when you tried it?</h2>
    <label>
      <span>Your reflection can include what helped, what got in the way, or what you would change.</span>
      <textarea id="practice-reflection" rows="5"></textarea>
    </label>
    <button class="primary-button" type="submit">Mark complete</button>
  </form>
</dialog>
