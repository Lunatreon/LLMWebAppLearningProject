<section id="map-view" class="map-view hidden">
  <header class="map-header workspace-header">
    <div class="conversation-heading">
      <button
        id="map-sidebar-toggle"
        class="icon-button sidebar-toggle"
        type="button"
        title="Open conversations"
        aria-label="Open conversations"
      >
        <span aria-hidden="true">&#9776;</span>
      </button>
      <div>
        <p class="eyebrow">Self-authorship</p>
        <h2>
          <span class="map-title-short">My Map</span>
          <span class="map-title-long">A map of yourself and your journey, growing from the reflections and connections you choose to save.</span>
        </h2>
      </div>
    </div>
    <div class="workspace-header-actions">
      <button id="add-topic-button" class="map-command" type="button" hidden>+ Add topic</button>
      <button
        class="theme-toggle header-theme-toggle"
        type="button"
        role="switch"
        aria-checked="false"
        aria-label="Use light appearance"
        title="Use light appearance"
        data-theme-toggle
      >
        <span aria-hidden="true">&#9790;</span>
        <span aria-hidden="true">&#9728;</span>
      </button>
    </div>
  </header>
  <div id="map-content" class="map-content"></div>
</section>
