<dialog id="email-verification-dialog" class="app-dialog">
  <button class="dialog-close" type="button" data-close-dialog="email-verification-dialog" aria-label="Close">&times;</button>
  <p class="eyebrow">Your private space</p>
  <h2>Activate your account</h2>
  <p>Enter the six-digit PIN from your FeelY email. You only need to activate your email once.</p>
  <form id="email-verification-form">
    <label><span>Email</span><input id="verification-email" type="email" autocomplete="email" required /></label>
    <label><span>Activation PIN</span><input id="verification-pin" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required /></label>
    <button class="primary-button" type="submit">Activate account</button>
    <button id="verification-resend" class="auth-link-button" type="button">Send a new PIN</button>
  </form>
  <p id="verification-status" role="status"></p>
</dialog>
