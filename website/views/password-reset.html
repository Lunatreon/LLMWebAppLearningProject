<dialog id="password-reset-dialog" class="app-dialog password-reset-dialog">
  <button
    class="dialog-close"
    type="button"
    data-close-dialog="password-reset-dialog"
    aria-label="Close"
  >
    &times;
  </button>
  <section id="password-reset-request-view">
    <p class="eyebrow">Account recovery</p>
    <h2>Reset your password</h2>
    <p>Enter the email address connected to your FeelY account.</p>
    <form id="password-reset-request-form">
      <label>
        <span>Email</span>
        <input id="password-reset-email" type="email" autocomplete="email" required />
      </label>
      <button class="primary-button" type="submit">Send reset link</button>
    </form>
  </section>
  <section id="password-reset-confirm-view" class="hidden">
    <p class="eyebrow">Choose a new password</p>
    <h2>Reset your password</h2>
    <form id="password-reset-confirm-form">
      <label>
        <span>New password</span>
        <input id="password-reset-new" type="password" minlength="8" autocomplete="new-password" required />
      </label>
      <label>
        <span>Confirm new password</span>
        <input id="password-reset-confirm" type="password" minlength="8" autocomplete="new-password" required />
      </label>
      <button class="primary-button" type="submit">Save new password</button>
    </form>
  </section>
  <p id="password-reset-status" class="form-error" role="status"></p>
</dialog>
