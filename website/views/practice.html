<dialog id="practice-dialog" class="app-dialog">
  <form id="practice-form" method="dialog">
    <button class="dialog-close" type="button" data-close-dialog="practice-dialog" aria-label="Close">&times;</button>
    <p class="eyebrow">A repeatable choice</p>
    <h2>Add a practice</h2>
    <label>
      <span>What would you like to try?</span>
      <textarea id="practice-text" rows="4" required></textarea>
    </label>
    <label>
      <span>Connect it to a topic</span>
      <select id="practice-topic"></select>
    </label>
    <button class="primary-button" type="submit">Save practice</button>
  </form>
</dialog>
